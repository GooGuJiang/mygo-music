# Pushing a tag such as v0.1.33 (matching mygo.config.ts) builds the Windows
# x64 installer, transfers the unchanged Windows x64 CUDA runtime ZIP from the
# previous release directly on GitHub Actions (avoiding slow local uploads),
# and publishes the release once both assets are verified and uploaded.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      prev_tag: ${{ steps.meta.outputs.prev_tag }}
      prev_setup: ${{ steps.meta.outputs.prev_setup }}
      prev_setup_sha: ${{ steps.meta.outputs.prev_setup_sha }}
      prev_cuda_sha: ${{ steps.meta.outputs.prev_cuda_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Resolve version, tag, and previous release assets
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log((await import("./mygo.config.ts")).default({ command: "build" }).version)')"
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::$GITHUB_REF_NAME doesn't match the version of mygo.config.ts, $tag"
              exit 1
            fi
          elif [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          commit="$(git rev-parse "$tag^{commit}")"

          prev_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" \
            --jq "[.[] | select(.draft == false and .tag_name != \"$tag\" and ([.assets[].name] | index(\"mygo-music-windows-amd64-cuda.zip\") != null) and any(.assets[].name; startswith(\"mygo-music-setup-\") and endswith(\"-amd64.exe\")))][0]")"
          if [ -z "$prev_json" ] || [ "$prev_json" = "null" ]; then
            echo "::error::Could not find a previous published release containing the Windows installer and CUDA runtime ZIP."
            exit 1
          fi

          prev_tag="$(printf '%s' "$prev_json" | jq -r '.tag_name')"
          prev_setup="$(printf '%s' "$prev_json" | jq -r '[.assets[] | select(.name | startswith("mygo-music-setup-") and endswith("-amd64.exe"))][0].name')"
          prev_setup_sha="$(printf '%s' "$prev_json" | jq -r '[.assets[] | select(.name | startswith("mygo-music-setup-") and endswith("-amd64.exe"))][0].digest // "" | sub("^sha256:"; "")')"
          prev_cuda_sha="$(printf '%s' "$prev_json" | jq -r '[.assets[] | select(.name == "mygo-music-windows-amd64-cuda.zip")][0].digest // "" | sub("^sha256:"; "")')"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "prev_tag=$prev_tag"
            echo "prev_setup=$prev_setup"
            echo "prev_setup_sha=$prev_setup_sha"
            echo "prev_cuda_sha=$prev_cuda_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            awk -v v="$VERSION" '
              /^## / { if (found) exit; found = index($0, "[" v "]") > 0; next }
              found
            ' CHANGELOG.md > notes.md
            if [ -s notes.md ]; then
              printf '\n### Windows x64\n\nThis release provides a Windows x64 installer (`mygo-music-setup-%s-amd64.exe`) and the optional CUDA runtime ZIP (`mygo-music-windows-amd64-cuda.zip`).\n' "$VERSION" >> notes.md
              notes=(--notes-file notes.md)
            else
              notes=(--generate-notes)
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$TAG" "${notes[@]}"
          fi

  windows:
    needs: draft-release
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      MYGO_MUSIC_RELEASE_REPOSITORY: ${{ github.repository }}
      CGO_ENABLED: "0"
      TAG: ${{ needs.draft-release.outputs.tag }}
      VERSION: ${{ needs.draft-release.outputs.version }}
      EXPECTED_COMMIT: ${{ needs.draft-release.outputs.commit }}
      PREV_TAG: ${{ needs.draft-release.outputs.prev_tag }}
      PREV_SETUP: ${{ needs.draft-release.outputs.prev_setup }}
      PREV_SETUP_SHA: ${{ needs.draft-release.outputs.prev_setup_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.draft-release.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Find Go's caches
        id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >> $env:GITHUB_OUTPUT
          echo "mod=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-Windows-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-Windows-
      - name: Restore the unchanged Windows native runtimes
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP $env:PREV_SETUP
          $expanded = Join-Path $env:RUNNER_TEMP 'prior-windows-resources'
          gh release download $env:PREV_TAG -R $env:GITHUB_REPOSITORY --pattern $env:PREV_SETUP --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:PREV_SETUP_SHA) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $old).Hash.ToLowerInvariant()
            if ($actual -ne $env:PREV_SETUP_SHA.ToLowerInvariant()) {
              throw "Previous release checksum mismatch: got $actual, expected $($env:PREV_SETUP_SHA)"
            }
          }
          & "$env:ProgramFiles/7-Zip/7z.exe" x -y "-o$expanded" $old
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resources = New-Item -ItemType Directory -Path resources/windows-amd64 -Force
          $markers = @{ demucs = 'mygo-demucs.exe'; 'native-codecs' = 'mygo-codec.dll'; rubberband = 'mygo-rubberband.dll' }
          foreach ($resource in $markers.Keys) {
            $dir = Get-ChildItem -LiteralPath $expanded -Recurse -Directory -Filter $resource |
              Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName $markers[$resource]) } |
              Select-Object -First 1
            if (!$dir) { throw "Missing previous release resources: $resource" }
            Copy-Item -LiteralPath $dir.FullName -Destination $resources.FullName -Recurse
          }
      - name: Build the Windows x64 installer
        run: |
          $ErrorActionPreference = 'Stop'
          go tool mygo build -platform windows/amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Get-Item -LiteralPath 'build/windows-amd64/MyGo Music.exe'
          if ($app.VersionInfo.ProductVersion -ne $env:VERSION) {
            throw "Unexpected application version: $($app.VersionInfo.ProductVersion)"
          }
          $meta = (go version -m $app.FullName) -join [Environment]::NewLine
          if (!$meta.Contains("vcs.revision=$($env:EXPECTED_COMMIT)") -or !$meta.Contains('vcs.modified=false')) {
            throw "Package commit mismatch"
          }
          $installer = "build/windows-amd64/mygo-music-setup-$($env:VERSION)-amd64.exe"
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer
      - name: Upload the verified installer
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "mygo-music-setup-$($env:VERSION)-amd64.exe"
          $candidate = Join-Path $env:RUNNER_TEMP $name
          Copy-Item -LiteralPath "build/windows-amd64/$name" -Destination $candidate -Force
          gh release upload $env:TAG $candidate -R $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  cuda:
    needs: draft-release
    name: Windows x64 CUDA runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.draft-release.outputs.tag }}
      PREV_TAG: ${{ needs.draft-release.outputs.prev_tag }}
      PREV_CUDA_SHA: ${{ needs.draft-release.outputs.prev_cuda_sha }}
    steps:
      - name: Transfer and verify the Windows x64 CUDA ZIP on GitHub CI
        run: |
          set -euo pipefail
          asset=mygo-music-windows-amd64-cuda.zip
          gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
          if [ -n "$PREV_CUDA_SHA" ]; then
            printf '%s  %s\n' "$PREV_CUDA_SHA" "$asset" | sha256sum --check
          fi
          gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [draft-release, windows, cuda]
    name: Publish release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.draft-release.outputs.tag }}
      VERSION: ${{ needs.draft-release.outputs.version }}
    steps:
      - name: Verify release assets and publish
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]')"
          printf '%s\n' "$assets" | jq -e --arg setup "mygo-music-setup-${VERSION}-amd64.exe" \
            'index($setup) != null and index("mygo-music-windows-amd64-cuda.zip") != null' > /dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
